<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Screenwatch seat helper</title>
<style>
  body{font:13px/1.4 system-ui,Segoe UI,sans-serif;width:340px;margin:0;padding:14px;color:#202334;background:#fff}
  h1{font-size:15px;margin:0 0 10px}
  label.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:10px}
  input[type=checkbox]{width:38px;height:20px}
  .field{display:flex;gap:6px;margin:6px 0}
  input[type=url]{flex:1;min-width:0;padding:6px 8px;border:1px solid #c9cdd8;border-radius:6px;font:inherit}
  button{font:600 12px system-ui,sans-serif;border:0;border-radius:6px;padding:6px 10px;background:#6655df;color:#fff;cursor:pointer}
  button.plain{background:#e8e9f1;color:#202334}
  .status{padding:6px 8px;border-radius:6px;background:#f0f1f6;margin:8px 0}.status.ok{background:#e3f7ea;color:#14532d}.status.bad{background:#fde8e8;color:#7f1d1d}
  .alerts{margin:8px 0;padding:0;list-style:none}.alerts li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eceef4}
  .muted{color:#747b8e;font-size:12px}.err{color:#b91c1c;font-size:12px;min-height:1em}
</style>
</head>
<body>
<h1>Screenwatch seat helper</h1>
<label class="row"><span>Enabled on this PC</span><input type="checkbox" id="enabled"></label>
<div class="muted">Dashboard address</div>
<div class="field"><input type="url" id="dashboard" spellcheck="false"><button id="save" class="plain">Save</button></div>
<div class="err" id="err"></div>
<div class="status" id="status">Off</div>
<div class="muted">Armed alerts</div>
<ul class="alerts" id="alerts"></ul>
<div class="muted">Last result</div>
<div id="last">Nothing yet.</div>
<script src="popup.js"></script>
</body>
</html>
